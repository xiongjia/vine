packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  esbuild: true

catalog:
  # React
  react: ^19.2.0
  react-dom: ^19.2.0
  "@types/react": ^19.2.2
  "@types/react-dom": ^19.2.2

  # Vite
  vite: ^6.3.5
  "@vitejs/plugin-react": ^4.5.0

  # Tailwind CSS
  tailwindcss: ^4.2.4
  "@tailwindcss/postcss": ^4.2.4
  postcss: ^8.5.3

  # Testing (frontend)
  vitest: ^3.0.0
  "@testing-library/react": ^16.0.0
  "@testing-library/jest-dom": ^6.9.1
  jsdom: ^26.1.0

  # Shared utilities
  clsx: ^2.1.1
  lucide-react: ^1.16.0
  tailwind-merge: ^3.2.0

  # Maps (locked to prototype-verified versions, see docs/refactory-draft.md 0.4)
  maplibre-gl: ^5.24.0
  pmtiles: ^4.4.1
  "@protomaps/basemaps": ^5.7.2
  "@mapbox/vector-tile": ^3.0.0
  "@types/geojson": ^7946.0.16
  pbf: ^5.1.2
  tsx: ^4.23.9
  dotenv: ^17.4.2
  "@tailwindcss/vite": ^4.2.4

  # maps-cli
  commander: ^15.0.0
  "@aws-sdk/client-s3": ^3.1105.0

  # Tooling
  typescript: ^5.9.2
  eslint: ^9.39.1
  "@types/node": ^22.15.3
  prettier: ^3.7.4
  turbo: ^2.9.18

minimumReleaseAgeExclude:
  - '@aws-sdk/client-s3@3.1105.0'
